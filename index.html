<style>

<body>
<header><h1>How Life Begins</h1><span id="counter"></span><progress id="progress" max="7" aria-label="Story progress"></progress></header>

<script>

}

const fetus=()=>'<circle cx="12" cy="-29" r="18" fill="#ffd1b5" stroke="#ad6d60" stroke-width="2"/><path d="M0 -17Q-24 -18 -28 0Q-33 19 -7 24Q9 27 17 15Q22 6 13 5Q6 4 2 12Q-9 11 -10 4Q4 5 8 -5" fill="#ffd1b5" stroke="#ad6d60" stroke-width="2" stroke-linecap="round"/><path d="M19 -26q4 3 7 0" fill="none" stroke="#87574c" stroke-width="2"/>';
function icon(label){
 const art={
  Bub:sperm(),Bal:sperm(true),Ellie:at(0,0,egg(),.76),'a baby':at(0,0,baby(),.72),
  one:at(0,0,sperm(),.82),two:at(-22,-13,sperm(),.58)+at(21,16,sperm(true),.58),

  'a leaf':'<path d="M-26 22Q-42 -24 29 -31Q32 19 -26 22Z" fill="#a8d9a1" stroke="#437a52" stroke-width="3"/><path d="M-33 29L16 -17" stroke="#437a52" stroke-width="3"/>',
  'a cloud':'<path d="M-35 21Q-53 2 -32 -9Q-26 -37 -3 -25Q18 -39 28 -13Q51 -9 43 12Q39 24 22 22Z" fill="#e8f4ff" stroke="#6585aa" stroke-width="3"/>',

const defs='<defs><radialGradient id="glow"><stop stop-color="#fffbe8"/><stop offset=".42" stop-color="#fff1ba" stop-opacity=".93"/><stop offset="1" stop-color="#fff1ba" stop-opacity="0"/></radialGradient><linearGradient id="sky" x2="1" y2="1"><stop stop-color="#f7cadd"/><stop offset=".55" stop-color="#ffe7d6"/><stop offset="1" stop-color="#dedaff"/></linearGradient></defs>';

 const bub=(x,y,cls,wave=false)=>at(x,y,`<g class="${cls}"><g class="float">${at(0,0,sperm(false,true,wave),1.35)}</g></g>`);
 const bal=(x,y,cls)=>at(x,y,`<g class="${cls}">${at(0,0,sperm(true),1.35)}</g>`);
 const ellie=(x,y)=>at(x,y,`<g class="float">${at(0,0,egg(),1.35)}</g>`);
 const light=glow(438,163,136);
 const figures=[
  bub(303,164,'swim',true),
  bub(230,113,'swim')+bal(330,177,'swim')+bal(238,240,'swim'),
  bub(176,131,'approach')+bal(212,213,'float')+bal(135,260,'float')+`<g class="appear">${light}</g>`,
  bub(163,163,'float')+`<g class="appear">${light+ellie(415,161)}</g>`,
  bub(273,172,'approach',true)+light+ellie(426,164),
  light+ellie(419,163)+bub(220,171,'float')+'<path class="ribbon" d="M360 164Q320 138 287 171Q266 190 243 173" fill="none" stroke="#fff9c5" stroke-width="14" stroke-linecap="round"/>'+star(260,173,.85),
  light+ellie(419,163)+bub(220,171,'float')
 ];
 return defs+'<rect width="600" height="340" fill="url(#sky)"/><path d="M0 64Q159 -10 337 54T600 28V0H0ZM0 270Q125 210 288 286T600 256V340H0Z" fill="#e6a4c6" opacity=".35"/><g class="twinkle">'+star(95,86)+star(509,72,.75)+star(115,258,.7)+star(482,265)+star(295,54,.65)+dot(543,204,5,'#fff4f6')+'</g>'+figures[i];
}
function scienceArt(step){
 const child=at(-9,-29,`<g class="grow">${fetus()}</g>`);
 const panels=[
  storyArt(6),
  at(337,162,egg(false))+at(270,162,'<g class="join">'+sperm(false,false)+'</g>',.68),
  at(300,162,cell()),
  at(311,171,womb(child),1.19),
  at(300,155,baby(),1.55)
 ];
 if(step===0)return panels[0];
 return '<rect width="600" height="340" fill="#f1f5ff"/><rect x="18" y="18" width="564" height="304" rx="25" fill="#fff" stroke="#d9ddf3" stroke-width="2"/><g class="appear">'+panels[step]+'</g>';

const scienceCaptions=['From story to science','An egg cell and a sperm cell meet.','One new cell','The baby grows in the uterus.','The baby is born.'];
const storyCaptions=['Bub swims.','Bub swims with his friends.','A light shines ahead.','Ellie is big and round.','Bub waves to Ellie.','A little light reaches toward Bub.'];
const chinese = {
 "Meet Bub": "認識 Bub",
 "“Hi! I’m Bub. I love to swim. Come swim with me!”": "「嗨！我是 Bub。我喜歡游泳。來和我一起游吧！」",
 "Bub is a sperm cell.": "Bub 是一個精子。",
 "sperm cell": "精子",
 "Who is Bub?": "誰是 Bub？",
 "Bub": "Bub",
 "Ellie": "Ellie",
 "a baby": "寶寶",
 "Bub is the little blue sperm cell.": "Bub 是有尾巴的藍色小精子。",
 "Look for the little blue cell with a tail.": "找找有尾巴的藍色小細胞。",
 "Meet Friends": "認識朋友",
 "Bub meets two friends. They swim together.": "Bub 遇到兩位朋友。他們一起游泳。",
 "How many sperm cells do you see?": "你看到幾個精子？",
 "three": "三個",
 "one": "一個",
 "two": "兩個",
 "Bub and his friends make three.": "Bub 和朋友們一共有三個。",

 "A Bright Light": "一道亮光",
 "Bub and his friends see a bright light. “What is that?” asks Bub.": "Bub 和朋友們看到一道亮光。「那是什麼？」Bub 問。",
 "light": "光",
 "What do Bub and his friends see?": "Bub 和朋友們看到了什麼？",
 "a soft light": "一道柔和的光",
 "a leaf": "一片葉子",
 "a cloud": "一朵雲",
 "They see a soft light ahead.": "他們看到前方有一道柔和的光。",
 "Look for the bright glow ahead of Bub and his friends.": "找找 Bub 和朋友們前方的亮光。",
 "Meet Ellie": "認識 Ellie",
 "This is Ellie. Ellie is an egg cell. She is big and round.": "這是 Ellie。Ellie 是一個卵子。她又大又圓。",
 "egg cell": "卵子",
 "Which one is the egg cell?": "哪一個是卵子？",
 "Bal": "Bal",
 "Ellie is the big, round egg cell.": "Ellie 是又大又圓的卵子。",
 "Look for the big, round cell.": "找找又大又圓的細胞。",
 "Bub Says Hello": "Bub 打招呼",
 "Bub swims near Ellie. “Hello! I’m Bub,” he says.": "Bub 游到 Ellie 身邊。他說：「你好！我是 Bub。」",
 "Who does Bub say hello to?": "Bub 跟誰打招呼？",
 "Bub says hello to Ellie.": "Bub 跟 Ellie 打招呼。",

 "A New Beginning": "新的開始",
 "A sperm cell and an egg cell meet inside the mother’s body.": "一個精子和一個卵子在媽媽的身體裡相遇。",

 "two cells": "兩個細胞",
 "a baby in a blanket": "裹著毯子的寶寶",

 "Bub swims.": "Bub 在游泳。",

 "A light shines ahead.": "前方有一道亮光。",

 "Bub waves to Ellie.": "Bub 向 Ellie 揮手。",
 "From story to science": "從故事看科學",
 "An egg cell and a sperm cell meet.": "一個卵子和一個精子相遇。",

 "How Life Begins": "生命如何開始",

};
const translation = value => `<span class="zh" lang="zh-Hant-TW">${value}</span>`;
const bilingual = (label, showChinese = index === 6) =>
 showChinese && chinese[label] !== label ? label + translation(chinese[label]) : label;
function showFeedback(correct){
 const message = scenes[index][correct ? 5 : 6];
 ui.feedback.innerHTML = (correct ? 'Yes! ' : 'Try again! ') + message
  + (index === 6 ? translation((correct ? '答對了！' : '再試一次！') + chinese[message]) : '');

const answers=Array(7).fill(false);

}
function updateNext(){
 ui.next.disabled=!answers[index]||ui.quiz.hidden;
}
function reveal(){
 ui.quiz.hidden=false;
 updateNext();
}
function play(){
 clearTimeout(timer);
 const currentRun=++run;
 ui.quiz.hidden=true;
 updateNext();
 if(index<6){

  ui.caption.innerHTML=bilingual(scienceCaptions[step]);

 }
 frame(0);
}
function render(focus=false){

    if(index===6 && !image.querySelector('.answer-stars')){
     image.insertAdjacentHTML('beforeend',`<g class="answer-stars">${star(-44,-23)+star(43,-22)+star(42,23,.7)}</g>`);
    }
    image.classList.add('celebrate');
   }
   updateNext();
  };
  return button;
 }));
 play();
 if(focus)ui.title.focus();
}
ui.back.onclick=()=>{if(index>0){index--;render(true);}};
ui.next.onclick=()=>{
 if(ui.next.disabled)return;
 if(index===6){ui.done.innerHTML=bilingual('Story complete!');return;}
 index++;
 render(true);
};
ui.replay.onclick=play;
ui.read.onclick=()=>{
 stopSpeech();
 const request=voiceRun;
 const fallback=()=>{if(request===voiceRun)ui.audio.innerHTML=bilingual('Read aloud is unavailable. You can read the story on screen.');};
 if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){fallback();return;}
 const voices=window.speechSynthesis.getVoices().filter(voice=>voice.localService);
 const voice=voices.find(voice=>/^en[-_]US$/i.test(voice.lang))||voices.find(voice=>/^en(?:[-_]|$)/i.test(voice.lang));
 if(!voice){fallback();return;}
 const line=new SpeechSynthesisUtterance(scenes[index][1].join(' '));
 line.voice=voice;
 line.lang=voice.lang;
 line.rate=.84;
 line.onerror=fallback;
 window.speechSynthesis.speak(line);
};
render();
</script></body></html>
